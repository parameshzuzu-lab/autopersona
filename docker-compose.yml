version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autopersona_db
    restart: always
    environment:
      POSTGRES_USER: autopersona
      POSTGRES_PASSWORD: autopersonapass
      POSTGRES_DB: autopersona_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopersona_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://autopersona:autopersonapass@db:5432/autopersona_db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autopersona_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
